name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: Ensure SonarQube Cloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          check_code=$(curl -s -o /tmp/sonar_check.json -w "%{http_code}" \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarqube.us/api/projects/search?organization=gourabd1ms&projects=gourabd1ms_rust.demo")
          exists=$(python3 -c "import json;print(json.load(open('/tmp/sonar_check.json'))['paging']['total'])" 2>/dev/null || echo 0)
          if [ "$check_code" = "200" ] && [ "$exists" != "0" ]; then
            echo "Project already exists, skipping creation"
          else
            http_code=$(curl -s -o /tmp/sonar_create.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarqube.us/api/projects/create" \
              --data-urlencode "organization=gourabd1ms" \
              --data-urlencode "project=gourabd1ms_rust.demo" \
              --data-urlencode "name=rust.demo")
            echo "HTTP $http_code"
            cat /tmp/sonar_create.json
            if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
              echo "Failed to create Sonar project"
              exit 1
            fi
          fi
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.us
